name: Metrics
on:
  # Roda todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente
  workflow_dispatch:
  # Roda quando você mexe no main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          # AQUI ESTÁ O SEGREDO: Usa o token que você criou
          token: ${{ secrets.METRICS_TOKEN }}

          # Configurações para remover TUDO e deixar só as linguagens
          base: ""
          config_order: languages
          
          # Configuração das Linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_colors: "github"
