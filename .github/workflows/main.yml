name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          
          # --- CORREÇÃO AQUI ---
          # Usa sua chave Mestra SÓ para ler os dados privados
          token: ${{ secrets.METRICS_TOKEN }}
          # Usa a chave padrão do GitHub SÓ para salvar o arquivo (evita erros)
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          # ---------------------

          # Configurações para remover cabeçalho e focar em linguagens
          base: ""
          config_order: languages
          
          # Configuração das Linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_colors: "github"
